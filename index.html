<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador C.A.D.I. - Misión Cónicas 11</title>
    <style>
        :root {
            --cadi-navy: #1B2A4A;
            --cadi-green: #00A86B;
            --cadi-light: #F4F7F9;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cadi-light);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 780px;
            overflow: hidden;
            border-top: 6px solid var(--cadi-green);
        }

        .header {
            background-color: var(--cadi-navy);
            color: var(--white);
            padding: 20px 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 5px 0 0 0;
            color: var(--cadi-green);
            font-weight: bold;
            font-size: 0.95rem;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--cadi-green);
            width: 0%;
            transition: width 0.3s ease;
        }

        .content {
            padding: 25px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--cadi-navy);
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--cadi-green);
            outline: none;
        }

        .btn {
            background-color: var(--cadi-green);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: #008a57;
        }

        .scenario-box {
            background-color: #eef4f8;
            border-left: 4px solid var(--cadi-navy);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .question-meta {
            font-size: 0.85rem;
            color: var(--cadi-green);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .option-card {
            border: 2px solid #e0e0e0;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
            display: flex;
            align-items: center;
        }

        .option-card:hover {
            border-color: var(--cadi-green);
            background: #f0fdf7;
        }

        .option-card input {
            margin-right: 12px;
        }

        .certificate {
            border: 3px double var(--cadi-navy);
            padding: 25px;
            text-align: center;
            background-color: #fff;
            border-radius: 8px;
        }

        .certificate h2 {
            color: var(--cadi-navy);
            margin-top: 0;
        }

        .score-badge {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--cadi-green);
            margin: 15px 0;
        }

        .verification-code {
            background-color: var(--cadi-navy);
            color: #fff;
            padding: 8px 15px;
            font-family: monospace;
            font-size: 1.1rem;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
        }

        .footer-note {
            font-size: 0.8rem;
            color: #777;
            text-align: center;
            padding: 15px;
            background-color: #fafafa;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
