<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.D.I. Academy - Simulador de Cónicas 11°</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #F8FAFC; color: #0F172A; padding: 20px; }

        header {
            background-color: #132247;
            color: white;
            padding: 16px 24px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .panel {
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            padding: 18px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .form-group select, .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
        }

        .results {
            background: #F1F5F9;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
        }

        canvas {
            width: 100%;
            height: 500px;
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            display: block;
        }

        .hash-bar {
            grid-column: 1 / -1;
            background: #132247;
            color: white;
            padding: 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hash-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: #38BDF8;
            font-family: monospace;
            font-weight: bold;
            padding: 8px;
            border-radius: 6px;
            width: 250px;
            text-align: center;
        }

        button {
            background: #0284C7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="font-size: 18px;">C.A.D.I. BILINGUAL ACADEMY</h1>
            <p style="font-size: 12px; color: #94A3B8;">Departamento de Matemática • Prof. Emmanuel Melgar</p>
        </div>
        <div style="background: #0284C7; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;">
            SIMULADOR 11°
        </div>
    </header>

    <div class="container">
        <div class="panel">
            <h3 style="margin-bottom: 12px; color: #132247;">Parámetros Cónicas</h3>
            
            <div class="form-group">
                <label>Tipo de Cónica</label>
                <select id="conicType" onchange="updateInputs()">
                    <option value="parabola">Parábola</option>
                    <option value="elipse">Elipse</option>
                    <option value="hiperbola">Hipérbola</option>
                </select>
            </div>

            <div class="form-group">
                <label>Orientación</label>
                <select id="orient" onchange="draw()">
                    <option value="vertical">Vertical</option>
                    <option value="horizontal">Horizontal</option>
                </select>
            </div>

            <div class="form-group">
                <label>Centro / Vértice h (X)</label>
                <input type="number" id="hVal" value="0" step="1" oninput="draw()">
            </div>

            <div class="form-group">
                <label>Centro / Vértice k (Y)</label>
                <input type="number" id="kVal" value="0" step="1" oninput="draw()">
            </div>

            <div class="form-group">
                <label id="labelA">Parámetro p (Distancia Focal)</label>
                <input type="number" id="aVal" value="3" step="0.5" oninput="draw()">
            </div>

            <div class="form-group" id="paramBGroup" style="display:none;">
                <label>Semieje Menor / Conjugado (b)</label>
                <input type="number" id="bVal" value="2" step="0.5" oninput="draw()">
            </div>

            <div class="results">
                <strong>Elementos Analíticos:</strong>
                <ul id="elementsList" style="margin-top: 6px; padding-left: 16px;"></ul>
            </div>
        </div>

        <div class="panel" style="padding: 10px;">
            <canvas id="graphCanvas" width="800" height="500"></canvas>
        </div>

        <div class="hash-bar">
            <div>
                <strong>Validación Táctica C.A.D.I.</strong>
                <div style="font-size: 11px; color: #94A3B8;">Generación de Hash para reporte sumativo</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="studentName" placeholder="Nombre Estudiante" style="padding: 8px; border-radius: 6px;" oninput="generateHash()">
                <input type="text" id="hashOutput" class="hash-input" readonly placeholder="CÓDIGO HASH">
                <button onclick="copyHash()">Copiar</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const scale = 20;

        function updateInputs() {
            const type = document.getElementById('conicType').value;
            const paramBGroup = document.getElementById('paramBGroup');
            const labelA = document.getElementById('labelA');

            if (type === 'parabola') {
                paramBGroup.style.display = 'none';
                labelA.innerText = 'Parámetro p (Distancia Focal)';
            } else {
                paramBGroup.style.display = 'block';
                labelA.innerText = 'Semieje Mayor / Transverso (a)';
            }
            draw();
        }

        function toCanvasX(x) { return canvas.width / 2 + x * scale; }
        function toCanvasY(y) { return canvas.height / 2 - y * scale; }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#E2E8F0';
            ctx.lineWidth = 1;

            for (let x = 0; x < canvas.width; x += scale) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += scale) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }

        function draw() {
            drawGrid();

            const type = document.getElementById('conicType').value;
            const orient = document.getElementById('orient').value;
            const h = parseFloat(document.getElementById('hVal').value) || 0;
            const k = parseFloat(document.getElementById('kVal').value) || 0;
            const a = parseFloat(document.getElementById('aVal').value) || 1;
            const b = parseFloat(document.getElementById('bVal').value) || 1;

            const list = document.getElementById('elementsList');
            list.innerHTML = '';

            ctx.lineWidth = 2.5;

            if (type === 'parabola') {
                const p = a;
                ctx.strokeStyle = '#0284C7';
                ctx.beginPath();

                if (orient === 'vertical') {
                    for (let x = -20; x <= 20; x += 0.1) {
                        let y = Math.pow(x - h, 2) / (4 * p) + k;
                        if (x === -20) ctx.moveTo(toCanvasX(x), toCanvasY(y));
                        else ctx.lineTo(toCanvasX(x), toCanvasY(y));
                    }
                    list.innerHTML += `<li><b>Vértice:</b> V(${h}, ${k})</li>`;
                    list.innerHTML += `<li><b>Foco:</b> F(${h}, ${k + p})</li>`;
                    list.innerHTML += `<li><b>Directriz:</b> y = ${k - p}</li>`;
                } else {
                    for (let y = -20; y <= 20; y += 0.1) {
                        let x = Math.pow(y - k, 2) / (4 * p) + h;
                        if (y === -20) ctx.moveTo(toCanvasX(x), toCanvasY(y));
                        else ctx.lineTo(toCanvasX(x), toCanvasY(y));
                    }
                    list.innerHTML += `<li><b>Vértice:</b> V(${h}, ${k})</li>`;
                    list.innerHTML += `<li><b>Foco:</b> F(${h + p}, ${k})</li>`;
                    list.innerHTML += `<li><b>Directriz:</b> x = ${h - p}</li>`;
                }
                ctx.stroke();

            } else if (type === 'elipse') {
                ctx.strokeStyle = '#0284C7';
                ctx.beginPath();
                let rx = orient === 'horizontal' ? a * scale : b * scale;
                let ry = orient === 'horizontal' ? b * scale : a * scale;
                ctx.ellipse(toCanvasX(h), toCanvasY(k), rx, ry, 0, 0, 2 * Math.PI);
                ctx.stroke();

                let c = Math.sqrt(Math.max(0, a*a - b*b));
                list.innerHTML += `<li><b>Centro:</b> C(${h}, ${k})</li>`;
                list.innerHTML += `<li><b>Distancia Focal:</b> c = ${c.toFixed(2)}</li>`;

            } else if (type === 'hiperbola') {
                ctx.strokeStyle = '#EA580C';
                ctx.beginPath();
                if (orient === 'horizontal') {
                    for (let t = -2; t <= 2; t += 0.05) {
                        let x1 = h + a * Math.cosh(t);
                        let y1 = k + b * Math.sinh(t);
                        if (t === -2) ctx.moveTo(toCanvasX(x1), toCanvasY(y1));
                        else ctx.lineTo(toCanvasX(x1), toCanvasY(y1));
                    }
                    ctx.stroke();
                    ctx.beginPath();
                    for (let t = -2; t <= 2; t += 0.05) {
                        let x2 = h - a * Math.cosh(t);
                        let y2 = k + b * Math.sinh(t);
                        if (t === -2) ctx.moveTo(toCanvasX(x2), toCanvasY(y2));
                        else ctx.lineTo(toCanvasX(x2), toCanvasY(y2));
                    }
                    ctx.stroke();
                }
                list.innerHTML += `<li><b>Centro:</b> C(${h}, ${k})</li>`;
            }

            ctx.fillStyle = '#132247';
            ctx.beginPath();
            ctx.arc(toCanvasX(h), toCanvasY(k), 5, 0, 2 * Math.PI);
            ctx.fill();

            generateHash();
        }

        function generateHash() {
            const name = document.getElementById('studentName').value || 'ALUMNO';
            const type = document.getElementById('conicType').value;
            const h = document.getElementById('hVal').value;
            const k = document.getElementById('kVal').value;
            
            const rawStr = `${name}-${type}-H${h}K${k}-CADI11`;
            let hash = 0;
            for (let i = 0; i < rawStr.length; i++) {
                hash = (hash << 5) - hash + rawStr.charCodeAt(i);
                hash |= 0;
            }
            document.getElementById('hashOutput').value = 'CADI-' + Math.abs(hash).toString(16).toUpperCase();
        }

        function copyHash() {
            const hashField = document.getElementById('hashOutput');
            navigator.clipboard.writeText(hashField.value);
            alert('¡Código Hash copiado!');
        }

        updateInputs();
    </script>
</body>
</html>
